<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nuy Tinck Runs!!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{--bg:#f4efe4;--ink:#1d1a16;--edge:#1d1a16;--btn:#8a1c2b;--btnink:#fffdf6;--sec:#e4dccb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15130f;--ink:#f1ebdc;--edge:#f1ebdc;--btn:#c9485a;--sec:#2b2620}}
:root[data-theme="dark"]{--bg:#15130f;--ink:#f1ebdc;--edge:#f1ebdc;--btn:#c9485a;--sec:#2b2620}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DotGothic16','Courier New',monospace}
body{padding:16px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px}
.wrap{width:100%;max-width:640px}
h1{font-size:24px;margin:0 0 4px}
p{margin:0 0 8px;font-size:17px;line-height:1.35}
canvas{display:block;width:100%;image-rendering:pixelated;border:3px solid var(--edge);background:#000;touch-action:manipulation}
button{font:inherit;font-size:18px;background:var(--btn);color:var(--btnink);border:0;padding:10px 16px;margin:8px 6px 0 0;cursor:pointer}
button.z{background:var(--sec);color:var(--ink);font-size:16px;padding:8px 12px}
button[hidden]{display:none}
.stage{position:relative;user-select:none;-webkit-user-select:none}
.dlg{position:absolute;left:6px;right:6px;top:6px;display:flex;gap:8px;align-items:center;background:rgba(14,10,28,.9);border:2px solid #f1ebdc;padding:4px 8px 4px 4px;color:#f1ebdc;pointer-events:none}
.dlg[hidden]{display:none}
.dlg img{width:40px;height:40px;flex:0 0 40px;image-rendering:pixelated;border:2px solid #f1ebdc}
.dlg img.bob{transform:translateY(-2px)}
.dlg .dx{flex:1;min-width:0}
.dlg b{display:block;font-size:14px;color:#f5b072;letter-spacing:.04em}
.dlg p{font-size:15px;margin:1px 0 0;line-height:1.2;color:#f1ebdc}
.fin{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:max-content;max-width:86%;background:rgba(14,10,28,.92);border:2px solid #f1ebdc;color:#f1ebdc;padding:8px 14px;text-align:center;pointer-events:none}
.fin[hidden]{display:none}
.fin b{display:block;font-size:26px;color:#f5b072;letter-spacing:.1em}
.fin span{display:block;font-size:15px;line-height:1.3}
.cap{border:3px solid var(--edge);padding:10px;margin:0 0 12px}
.cap img{display:block;width:100%;max-width:260px;aspect-ratio:3/4;object-fit:cover;image-rendering:pixelated;border:3px solid var(--edge);margin:0 auto 8px}
.cap h3{margin:0 0 4px;font-size:22px}
.cap .ab{margin:0 0 8px;font-size:18px;line-height:1.35}
.cap summary{cursor:pointer;font-size:18px;font-weight:bold}
.cap ul{margin:8px 0 0;padding-left:18px;font-size:17px;line-height:1.4}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:17px;margin-top:6px}
html,body{background:#0b1017;color:#f1ebdc}
body{min-height:100vh;padding:12px;gap:10px;justify-content:center}
canvas{border-color:#f1ebdc}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.top .tt{font-size:20px;color:#f5b072;letter-spacing:.04em}
button{background:#c9485a;color:#fffdf6}
button.sec{background:#2b2620;color:#f1ebdc;font-size:16px;padding:8px 14px;margin:0}
button.big{display:block;width:100%;font-size:22px;padding:16px;margin:10px 0 0;touch-action:manipulation}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row[hidden]{display:none}
.row button{margin:0}
.foot{margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><b class="tt">Nuy Tinck Runs!!</b><button id="xb" type="button" class="sec">Esci</button></div>
  <div class="stage" id="stage"><canvas id="g" width="320" height="180"></canvas>
    <div class="fin" id="fin" hidden></div>
    <div class="dlg" id="dlg" hidden><img id="dp" alt=""><div class="dx"><b id="dn"></b><p id="dt"></p></div></div></div>
  <div class="hud"><span id="h1">Colpi: 0</span><span id="h3">Zona: Città in rovina</span><span id="h2">Distanza: 0 m</span></div>
  <div class="row" id="endrow" hidden><button id="pz" type="button">Riscuoti il premio</button><button id="rb" type="button" class="sec">Rigioca</button></div>
  <button id="jb" type="button" class="big">Salta</button>
  <div class="foot"><button id="au" type="button" class="sec">Audio: sì</button></div>
</div>
<canvas id="s" width="1" height="1" hidden></canvas>
<script>
(function(){
  var g=document.getElementById('g'), c=g.getContext('2d');
  var sc=document.getElementById('s'), sx=sc.getContext('2d');
  function R(ctx,x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
  var seed=7; function rnd(){ seed=(seed*16807)%2147483647; return seed/2147483647; }

  /* ---------- suoni (Web Audio) ---------- */
  var AC=null, SND=true;
  function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
  function tone(f0,f1,dur,type,vol,delay){ if(!SND) return; var a=ac(); if(!a) return; var t0=a.currentTime+(delay||0);
    var o=a.createOscillator(), gn=a.createGain(); o.type=type||'square';
    o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
    gn.gain.setValueAtTime(vol||0.06,t0); gn.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(gn); gn.connect(a.destination); o.start(t0); o.stop(t0+dur+0.02); }
  function noise(dur,vol,lp){ if(!SND) return; var a=ac(); if(!a) return; var n=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
    var s=a.createBufferSource(), f=a.createBiquadFilter(), gn=a.createGain(); s.buffer=b; f.type='lowpass'; f.frequency.value=lp||1000;
    gn.gain.setValueAtTime(vol||0.1,a.currentTime); gn.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
    s.connect(f); f.connect(gn); gn.connect(a.destination); s.start(); }
  var MUS={buf:null,src:null,gain:null,loading:false,want:false}, MUSLEN=34.077;
  function musLoad(){ var a=AC; if(!a||MUS.buf||MUS.loading) return; MUS.loading=true;
    fetch('musica-nuy.mp3').then(function(r){ return r.arrayBuffer(); })
      .then(function(b){ return new Promise(function(res,rej){ a.decodeAudioData(b,res,rej); }); })
      .then(function(buf){ MUS.buf=buf; MUS.loading=false; if(MUS.want) musPlay(); })
      .catch(function(){ MUS.loading=false; }); }
  function musPlay(){ var a=AC; if(!a||!SND||MUS.src) return; if(!MUS.buf){ musLoad(); return; }
    var s=a.createBufferSource(), gn=a.createGain(); s.buffer=MUS.buf; s.loop=true; s.loopStart=0; s.loopEnd=Math.min(MUS.buf.duration,MUSLEN);
    gn.gain.value=0.55; s.connect(gn); gn.connect(a.destination); s.start(); MUS.src=s; MUS.gain=gn; }
  function musHalt(fade){ var s=MUS.src, gn=MUS.gain; MUS.src=null; MUS.gain=null; if(!s) return;
    try{ if(fade&&AC){ gn.gain.setValueAtTime(gn.gain.value,AC.currentTime); gn.gain.linearRampToValueAtTime(0.0001,AC.currentTime+fade); s.stop(AC.currentTime+fade+0.05); } else s.stop(); }catch(e){} }
  function musStart(){ MUS.want=true; musHalt(0); if(AC) musPlay(); }
  function musStop(fade){ MUS.want=false; musHalt(fade); }
  function sfx(k){
    if(k==='jump') tone(330,720,0.11,'square',0.05);
    else if(k==='hit'){ noise(0.18,0.12,900); tone(220,90,0.18,'square',0.05); }
    else if(k==='boom') noise(0.55,0.2,420);
    else if(k==='throw') tone(520,240,0.12,'triangle',0.05);
    else if(k==='drop') tone(1100,300,0.6,'sine',0.03);
    else if(k==='break'){ tone(320,40,1.0,'sawtooth',0.07); noise(0.7,0.08,1400); }
    else if(k==='title'){ tone(392,392,0.18,'square',0.05); tone(523,523,0.18,'square',0.05,0.12); tone(784,784,0.35,'square',0.05,0.24); }
    else if(k==='miao'){ tone(720,520,0.18,'triangle',0.06); tone(520,940,0.28,'triangle',0.06,0.16); }
    else if(k==='charge') tone(200,900,0.45,'sawtooth',0.03);
    else if(k==='zap'){ tone(1400,180,0.2,'square',0.05); noise(0.12,0.06,3000); }
    else if(k==='zone'){ tone(523,523,0.1,'square',0.04); tone(659,659,0.16,'square',0.04,0.09); }
    else if(k==='fin'){ tone(523,523,0.15,'square',0.05); tone(659,659,0.15,'square',0.05,0.15); tone(784,784,0.15,'square',0.05,0.3); tone(1046,1046,0.4,'square',0.05,0.45); }
  }

  /* ---------- sprite ---------- */
  var COL={orange:'#e8833a',dorange:'#b5552a',red:'#c1272d',dred:'#7a1620',cream:'#f3e6c4',ink:'#1b1220',skin:'#e0a37e',blue:'#27406b',grey:'#c9c9d1',hair:'#2a1a1a'};
  function nuy(ctx,x,y,f,state){
    var leg=state==='jump'?0:(f%2), red=state==='hit'?'#ff6a6a':COL.red;
    R(ctx,x-4,y-9,6,2,COL.dorange);
    R(ctx,x+2,y-4+(leg?0:1),3,4-(leg?0:1),COL.dred);
    R(ctx,x+8,y-4+(leg?1:0),3,4-(leg?1:0),COL.dred);
    R(ctx,x+1,y-13,11,9,red); R(ctx,x+1,y-8,11,1,COL.dred);
    R(ctx,x-1,y-12+(state==='jump'?-1:(f%2)),2,5,COL.dred);          // falda del cappotto che svolazza
    R(ctx,x+8,y-21,10,11,COL.dorange); R(ctx,x+10,y-19,9,8,COL.orange);
    R(ctx,x+17,y-20,3,2,COL.cream); R(ctx,x+19,y-15,2,2,COL.cream);
    R(ctx,x+14,y-17,2,2,'#fff'); R(ctx,x+15,y-17,1,1,COL.ink); R(ctx,x+8,y-21,10,1,COL.ink);
  }
  function nuyFlip(ctx,x,y,f,state){ ctx.save(); ctx.translate(2*x+17,0); ctx.scale(-1,1); nuy(ctx,x,y,f,state); ctx.restore(); }
  function qmark(ctx,x,y){ R(ctx,x,y,9,11,'#fffdf6'); R(ctx,x+3,y+11,3,2,'#fffdf6');
    R(ctx,x+3,y+2,3,1,COL.ink); R(ctx,x+6,y+3,1,2,COL.ink); R(ctx,x+4,y+5,2,1,COL.ink); R(ctx,x+4,y+6,1,1,COL.ink); R(ctx,x+4,y+8,1,1,COL.ink); }
  // robot da inseguimento (scala s). Vetro oscurato: Dani e Silvya si vedono solo a cabina aperta (emb)
  function robot(ctx,x,y,f,arm,s,broken,emb){ s=s||1;
    function Q(dx,dy,w,h,col){ R(ctx,x+dx*s,y+dy*s,w*s,h*s,col); }
    var b=broken?0:(f%2), lu=b?2:0, ld=b?0:2, sag=broken?2:0;
    Q(7,-15-lu,5,13,'#5b6170'); Q(4,-3-lu,10,3,'#3a3f4a');
    Q(23,-15-ld,5,13,'#5b6170'); Q(20,-3-ld,10,3,'#3a3f4a');
    var by=-b+sag;
    Q(2,by-35,32,21,'#7d8597'); Q(2,by-35,32,2,'#a3abbb'); Q(2,by-18,32,2,'#4a505e');
    Q(5,by-31,2,2,'#4a505e'); Q(29,by-31,2,2,'#4a505e'); Q(12,by-26,12,3,broken?'#5a4a3a':'#ffb84d');
    Q(5,by-48,26,13,'#3a3f4a');
    if(emb){
      Q(6,by-47,24,11,'#1d2a33');
      Q(9,by-44,5,5,COL.skin); Q(9,by-42,5,1,COL.ink); Q(9,by-40,5,2,COL.grey);
      Q(19,by-47,7,5,COL.hair); Q(20,by-44,5,5,COL.skin); Q(21,by-43,1,1,COL.ink); Q(23,by-43,1,1,COL.ink);
      Q(9,by-41,1,1,'#ff6a7a'); Q(13,by-41,1,1,'#ff6a7a'); Q(20,by-42,1,1,'#ff6a7a'); Q(24,by-42,1,1,'#ff6a7a');
      Q(15,by-45,1,2,'#7fd0ff'); Q(26,by-46,1,2,'#7fd0ff');
      Q(3,by-56,13,2,'#3a3f4a'); Q(4,by-55,11,1,'#2f4c5e'); Q(20,by-58,13,2,'#3a3f4a'); Q(21,by-57,11,1,'#2f4c5e');
    } else {
      Q(6,by-47,24,11,'#24404f'); Q(7,by-46,12,1,'rgba(255,255,255,.45)'); Q(8,by-44,5,1,'rgba(255,255,255,.25)'); Q(22,by-40,6,1,'rgba(255,255,255,.18)');
      if(broken){ Q(10,by-38,8,1,'#0f1a20'); Q(17,by-37,6,1,'#0f1a20'); }
    }
    Q(17,by-52,1,4,COL.ink); Q(16,by-53,3,1,broken?'#553':'#ff4d5e');
    if(broken){ Q(33,by-22,4,10,'#5b6170'); Q(32,by-12,6,3,'#3a3f4a'); }
    else if(arm){ Q(33,by-44,4,12,'#5b6170'); Q(32,by-47,6,4,'#3a3f4a'); }
    else { Q(33,by-32,10,4,'#5b6170'); Q(42,by-33,3,6,'#3a3f4a'); }
  }
  function plane(ctx,x,y,f){
    R(ctx,x,y,20,4,'#6b7a5a'); R(ctx,x-2,y+1,3,2,'#4a5640'); R(ctx,x+16,y-4,4,4,'#6b7a5a');   // fusoliera, muso, coda
    R(ctx,x+6,y+1,8,1,'#3a4632'); R(ctx,x+5,y-1,10,1,'#8a9a74'); R(ctx,x+4,y+4,2,1,COL.ink);
    R(ctx,x-3,y-2+(f%2?0:3),1,4,'#c9c9d1'); R(ctx,x+3,y+1,2,1,'#9fd6e8'); }
  function catBalloon(ctx,x,y){
    var O='#f08a3c', D='#c0602a', P='#ff9fb8';
    R(ctx,x+2,y+4,30,22,O); R(ctx,x,y+8,34,14,O); R(ctx,x+5,y+2,24,2,O);
    R(ctx,x+3,y-4,5,6,O); R(ctx,x+4,y-6,3,2,O); R(ctx,x+26,y-4,5,6,O); R(ctx,x+27,y-6,3,2,O);   // orecchie
    R(ctx,x+5,y-2,1,3,P); R(ctx,x+28,y-2,1,3,P);
    R(ctx,x+2,y+6,30,2,D); R(ctx,x+12,y+4,10,1,D);                                              // strisce
    R(ctx,x+8,y+11,5,5,'#7ad35a'); R(ctx,x+21,y+11,5,5,'#7ad35a'); R(ctx,x+10,y+11,1,5,COL.ink); R(ctx,x+23,y+11,1,5,COL.ink);  // occhi
    R(ctx,x+16,y+17,3,2,P); R(ctx,x+14,y+20,3,1,COL.ink); R(ctx,x+18,y+20,3,1,COL.ink);         // naso e bocca a «w»
    R(ctx,x-4,y+16,9,1,'#fff'); R(ctx,x-3,y+19,8,1,'#fff'); R(ctx,x+29,y+16,9,1,'#fff'); R(ctx,x+29,y+19,8,1,'#fff');  // baffi
    for(var i=0;i<8;i++){ R(ctx,x+8+Math.floor(i/2),y+26+i,1,1,'#3a2a20'); R(ctx,x+26-Math.floor(i/2),y+26+i,1,1,'#3a2a20'); }  // corde
    R(ctx,x+11,y+34,12,6,'#8a5a32'); R(ctx,x+11,y+34,12,1,'#c48a52'); R(ctx,x+15,y+33,2,1,'#e86aa0');  // cesta
  }
  function turret(ctx,o,gy){ gy=gy||GY; var x=o.x, on=o.st==='charge'?(Math.floor(t*16)%2):0;
    R(ctx,x,gy-6,10,6,'#2a2440'); R(ctx,x,gy-6,10,1,'#4a4470'); R(ctx,x+2,gy-10,6,4,'#3a3460');
    R(ctx,x-4,gy-7,5,2,'#5a5490'); R(ctx,x+4,gy-9,2,2,o.st==='charge'?(on?'#fff':'#ff4d5e'):'#6a2a3a'); }
  function thing(ctx,x,y,k){
    if(k===0){ R(ctx,x,y,3,6,'#4a8f5a'); R(ctx,x+1,y-2,1,2,'#4a8f5a'); }
    else if(k===1){ R(ctx,x,y,6,4,'#a14b32'); R(ctx,x+1,y+1,1,1,'#d98b6a'); }
    else if(k===2){ R(ctx,x,y,5,5,'#b8b8c0'); R(ctx,x,y,5,1,'#e6e6ee'); }
    else if(k===3){ R(ctx,x,y,8,8,'#222'); R(ctx,x+2,y+2,4,4,'#555'); R(ctx,x+3,y+3,2,2,'#222'); }
    else if(k===4){ R(ctx,x,y,4,6,'#2a2a2a'); R(ctx,x+1,y-2,2,2,'#ff4d5e'); R(ctx,x,y+6,4,1,'#555'); }       // bomba
    else if(k===5){ R(ctx,x+1,y,5,7,'#e86aa0'); R(ctx,x,y+1,7,5,'#e86aa0'); R(ctx,x+1,y+2,5,1,'#b8457a'); R(ctx,x+2,y+4,4,1,'#b8457a'); R(ctx,x+6,y+5,3,1,'#e86aa0'); }  // gomitolo
    else { R(ctx,x,y+2,7,1,'#eae6da'); for(var b=1;b<7;b+=2) R(ctx,x+b,y,1,5,'#eae6da'); R(ctx,x+7,y,3,5,'#eae6da'); R(ctx,x+8,y+1,1,1,COL.ink); R(ctx,x-2,y+1,2,3,'#eae6da'); }  // lisca
  }
  function dani(ctx,x,y){ var s=2;
    R(ctx,x,y-3*s,2*s,3*s,COL.ink); R(ctx,x+3*s,y-3*s,2*s,3*s,COL.ink);
    R(ctx,x-s,y-11*s,7*s,8*s,COL.blue); R(ctx,x,y-17*s,5*s,6*s,COL.skin);
    R(ctx,x,y-14*s,5*s,1*s,COL.ink); R(ctx,x,y-12*s,5*s,2*s,COL.grey); }
  function silvya(ctx,x,y){ var s=2;
    R(ctx,x,y-3*s,2*s,3*s,COL.ink); R(ctx,x+3*s,y-3*s,2*s,3*s,COL.ink);
    R(ctx,x-s,y-11*s,7*s,8*s,'#3a2e54'); R(ctx,x-s,y-19*s,7*s,7*s,COL.hair);
    R(ctx,x,y-16*s,5*s,5*s,COL.skin); R(ctx,x+s,y-14*s,1*s,1*s,COL.ink); R(ctx,x+3*s,y-14*s,1*s,1*s,COL.ink); }

  /* ---------- zone e fondali ---------- */
  function mkSky(bands,stars,orb){ var cv=document.createElement('canvas'); cv.width=320; cv.height=180; var q=cv.getContext('2d');
    for(var i=0;i<bands.length;i++) R(q,0,i*14,320,14,bands[i]); R(q,0,bands.length*14,320,60,bands[bands.length-1]);
    seed=3; for(var s=0;s<stars;s++) R(q,Math.floor(rnd()*320),Math.floor(rnd()*80),1,1,'#fff6d8');
    if(orb){ R(q,orb.x,orb.y+2,orb.r,orb.r-4,orb.c); R(q,orb.x+2,orb.y,orb.r-4,orb.r,orb.c); if(orb.ring) R(q,orb.x-6,orb.y+orb.r/2,orb.r+12,2,orb.ring); }
    return cv; }
  function layer(fn){ var cv=document.createElement('canvas'); cv.width=640; cv.height=180; fn(cv.getContext('2d')); return cv; }
  function skyline(h,col,wmin,wmax,win,s0){ return layer(function(q){ seed=s0||h; var x=0;
    while(x<640){ var w=wmin+Math.floor(rnd()*(wmax-wmin)), bh=h+Math.floor(rnd()*40); R(q,x,150-bh,w,bh,col);
      if(win){ R(q,x+Math.floor(w*0.5),150-bh-4,Math.floor(w*0.3),4,col);
        for(var wy=150-bh+6;wy<140;wy+=9) for(var wx=x+3;wx<x+w-3;wx+=7) if(rnd()<0.18) R(q,wx,wy,2,3,win); }
      x+=w+Math.floor(rnd()*4); } }); }
  function cranes(col,light){ return layer(function(q){ seed=11;
    for(var x=20;x<640;x+=110+Math.floor(rnd()*40)){ var h=70+Math.floor(rnd()*30);
      R(q,x,150-h,5,h,col); R(q,x-30,150-h,70,4,col); R(q,x+34,150-h+4,1,24+Math.floor(rnd()*20),col); R(q,x-26,150-h-8,4,8,col); R(q,x+1,150-h-2,2,2,light); }

    ox=-(scrMid%640); c.drawImage(Z.mid,ox,0); c.drawImage(Z.mid,ox+640,0);
    R(c,0,GY,320,30,Z.gnd); R(c,0,GY,320,2,Z.edge);
    var cx=-(scrGround%24); for(var i=0;i<16;i++) R(c,cx+i*24,GY+14,12,2,Z.dash);
    c.globalAlpha=1; }
  function drawOb(o,Z){
    if(o.k==='ditch'){ if(o.crater){ R(c,o.x,GY,o.w,30,'#0c0806'); R(c,o.x-3,GY-2,o.w+6,3,'#3a2a20'); R(c,o.x+2,GY+20,o.w-4,10,'#7a3a1a'); }
      else { R(c,o.x,GY,o.w,30,Z.pit); R(c,o.x,GY+22,o.w,8,Z.pitb); } }
    else if(o.k==='crate'){ R(c,o.x,GY-o.h,o.w,o.h,'#8a5a32'); R(c,o.x,GY-o.h,o.w,1,'#c48a52'); R(c,o.x+4,GY-o.h,1,o.h,'#5e3b1e'); }
    else if(o.k==='stack'){ R(c,o.x,GY-o.h,o.w,o.h,'#6b6f7a'); R(c,o.x,GY-o.h,o.w,2,'#a7acb8'); R(c,o.x+2,GY-o.h+5,o.w-4,1,'#3f434d'); R(c,o.x+2,GY-o.h+10,o.w-4,1,'#3f434d'); }
    else if(o.k==='debris'){ thing(c,o.x,GY-o.h,o.t); }
    else if(o.k==='barrel'){ R(c,o.x,GY-o.h,o.w,o.h,'#2f6a8a'); R(c,o.x,GY-o.h+3,o.w,1,'#1d4a63'); R(c,o.x,GY-o.h+7,o.w,1,'#1d4a63'); R(c,o.x+2,GY-o.h+1,2,1,'#e0c040'); }
    else if(o.k==='container'){ R(c,o.x,GY-o.h,o.w,o.h,o.c); for(var r=o.x+2;r<o.x+o.w-1;r+=3) R(c,r,GY-o.h+2,1,o.h-4,'rgba(0,0,0,.28)'); R(c,o.x,GY-o.h,o.w,1,'rgba(255,255,255,.25)'); }
    else if(o.k==='forklift'){ R(c,o.x+6,GY-11,14,8,'#e0b43a'); R(c,o.x+10,GY-13,8,2,'#1b1220'); R(c,o.x+2,GY-13,2,13,'#3a3f4a'); R(c,o.x-2,GY-3,6,1,'#9aa0b4'); R(c,o.x+7,GY-3,4,3,'#222'); R(c,o.x+15,GY-3,4,3,'#222'); }
    else if(o.k==='log'){ R(c,o.x,GY-o.h,o.w,o.h,'#6a4428'); R(c,o.x,GY-o.h,o.w,1,'#8a5c38'); R(c,o.x+o.w-4,GY-o.h,4,o.h,'#c4955c'); R(c,o.x+o.w-3,GY-o.h+2,2,3,'#8a5c38'); R(c,o.x+6,GY-o.h-2,3,2,'#3f7a4a'); }
    else if(o.k==='laser'){ var on=Math.floor(t*12)%2; R(c,o.x,GY-o.h,3,o.h,'#3a3f4a'); R(c,o.x+15,GY-o.h,3,o.h,'#3a3f4a'); R(c,o.x,GY-o.h,3,1,'#ff4d5e'); R(c,o.x+15,GY-o.h,3,1,'#ff4d5e');
      R(c,o.x+3,GY-5,12,1,on?'#ff4d5e':'#ff8a95'); R(c,o.x+3,GY-10,12,1,on?'#ff8a95':'#ff4d5e'); R(c,o.x+3,GY-6,12,3,'rgba(255,77,94,.25)'); }
    else if(o.k==='turret'){ turret(c,o); }
    else if(o.k==='beam'){ R(c,o.x-2,o.y-1,o.w+4,o.h+2,'rgba(255,77,190,.35)'); R(c,o.x,o.y,o.w,o.h,'#ff4dbe'); R(c,o.x+2,o.y+1,o.w-4,1,'#fff'); }
    else { R(c,o.x,o.y,o.w,o.h,'#4b4f63'); R(c,o.x+4,o.y+1,3,2,'#ff4d5e'); R(c,o.x-2,o.y-2,4,1,'#9aa0b4'); R(c,o.x+10,o.y-2,4,1,'#9aa0b4'); } }
  function drawWall(){ if(!wall) return; var x=wall.x;
    R(c,x,40,60,GY-40,'#4a4560'); for(var y=44;y<GY;y+=10){ for(var bx=x+((y/10)%2?0:6);bx<x+60;bx+=12) R(c,bx,y,11,9,'#5a5574'); }
    R(c,x,GY-10,60,10,'#e0b43a'); for(var k=0;k<60;k+=10) R(c,x+k,GY-10,5,10,'#1b1220');
    R(c,x+14,70,32,14,'#c1272d'); R(c,x+18,75,24,4,'#fffdf6'); }
  function outlined(str,x,y,size,fill,shadow){ c.font='400 '+size+'px "DotGothic16", monospace'; c.textAlign='center'; c.textBaseline='middle';
    if(shadow){ c.fillStyle=shadow; c.fillText(str,x+3,y+3); }
    c.fillStyle='#1b1220'; [[-2,0],[2,0],[0,-2],[0,2]].forEach(function(o){ c.fillText(str,x+o[0],y+o[1]); });
    c.fillStyle=fill; c.fillText(str,x,y); }
  function drawTitle(){ var k=Math.min(1,tt/0.15), s2=1.7-0.7*k;
    c.fillStyle='rgba(10,6,20,'+(0.35*k)+')'; c.fillRect(0,0,320,180);
    if(tt<0.2){ c.fillStyle='rgba(255,255,255,'+(0.7*(1-tt/0.2))+')'; c.fillRect(0,0,320,180); }
    c.save(); c.translate(160,92); c.scale(s2,s2); c.rotate(-0.06);
    outlined('NUY TINCK',0,-14,30,'#f5b072','#7a1620'); outlined('RUNS!!',0,16,34,'#e8833a','#7a1620'); c.restore(); }
  function drawBanner(){ if(bannerT<=0 || state==='title') return; c.globalAlpha=Math.min(1,bannerT/0.5,(2.4-bannerT)/0.3);
    outlined('ZONA '+(zone+1)+' · '+ZONES[zone].n.toUpperCase(),160,72,14,'#fff3c4',null); c.globalAlpha=1; }
  function draw(){
    var Z=ZONES[zone]; c.imageSmoothingEnabled=false; c.save();
    if(shakeT>0) c.translate(Math.round(Math.random()*4-2),Math.round(Math.random()*4-2));
    if(fadeT>0){ drawBG(ZONES[prevZone],1); drawBG(Z,1-fadeT); } else drawBG(Z,1);
    planes.forEach(function(p){ plane(c,p.x,p.y,Math.floor(t*20)); });
    balloons.forEach(function(b){ catBalloon(c,b.x,b.y+Math.sin(t*2)*2); });
    drawWall();
    obs.forEach(function(o){ drawOb(o,Z); });
    var broken=state==='end'&&et>1.4, emb=state==='end'&&et>2.8;
    robot(c,RX,GY,f,armT>0,RS,broken,emb);
    if(broken && Math.random()<0.35) R(c,RX+(8+Math.random()*28)*RS,GY-(10+Math.random()*30)*RS,2,2,'#ffd166');
    smoke.forEach(function(p){ var a=Math.max(0,1-p.life/2); c.fillStyle='rgba(170,170,180,'+(0.75*a)+')'; c.fillRect(Math.round(p.x),Math.round(p.y),Math.round(p.r),Math.round(p.r)); });
    objs.forEach(function(o){ var lx=landX(o); if(o.k>=4){ var on=Math.floor(t*10)%2; R(c,lx-4,GY-1,9,2,on?'#ff4d5e':'rgba(0,0,0,.6)'); } else R(c,lx-3,GY-1,7,2,'rgba(0,0,0,.6)'); thing(c,o.x,o.y,o.k); });
    parts.forEach(function(p){ c.globalAlpha=Math.max(0,1-p.life/p.max); R(c,p.x,p.y,p.s,p.s,p.c); }); c.globalAlpha=1;
    if(state==='end'){ if(et<0.5) nuy(c,nx,GY,0,'jump'); else nuyFlip(c,nx,GY,0,'jump'); if(et>2.0) qmark(c,nx+6,GY-38); }
    else if(!(inv>0 && Math.floor(t*20)%2)) nuy(c,nx,ny,f,(ny<GY-0.5||vy<0)?'jump':(inv>0?'hit':'run'));
    drawBanner();
    if(state==='title') drawTitle();
    if(state==='wait'){ c.fillStyle='rgba(10,6,20,.55)'; c.fillRect(0,0,320,180); outlined('NUY TINCK RUNS!!',160,78,22,'#f5b072','#7a1620'); if(Math.floor(performance.now()/500)%2) outlined('TOCCA PER INIZIARE',160,108,12,'#fff3c4',null); }
    c.restore();
    document.getElementById('h1').textContent='Colpi: '+hits;
    document.getElementById('h2').textContent='Distanza: '+Math.floor(dist)+' m';
    document.getElementById('h3').textContent='Zona: '+Z.n;
  }
  function sheet(){
    sx.imageSmoothingEnabled=false; R(sx,0,0,320,130,'#2a2142'); R(sx,0,112,320,18,'#1b1630');
    nuy(sx,8,108,0,'run'); nuy(sx,36,108,1,'run'); nuy(sx,64,108,0,'jump'); nuy(sx,92,108,0,'hit');
    robot(sx,118,112,0,false,1); robot(sx,166,112,1,true,1,true,true);
    plane(sx,214,30,0); thing(sx,244,40,4); catBalloon(sx,150,10); thing(sx,196,40,5); thing(sx,192,54,6);
    turret(sx,{x:30,st:'charge'},112);
    thing(sx,214,96,0); thing(sx,222,96,1); thing(sx,232,96,2); thing(sx,242,94,3);
    dani(sx,276,110); silvya(sx,300,110);
  }

  /* ---------- premio: lo mostra il gioco ---------- */
  if(REPLAY) pz.textContent='Rivedi le carte';
  pz.addEventListener('click',function(){ musStop(0); post('prize'); });
  var xb=document.getElementById('xb'); if(!EMB) xb.hidden=true;
  xb.addEventListener('click',function(){ musStop(0); post('close'); });

  /* ---------- comandi ---------- */
  window.addEventListener('keydown',function(e){ if(e.repeat) return; if(e.code==='Space'||e.code==='ArrowUp'){ e.preventDefault(); press(); } });
  window.addEventListener('keyup',function(e){ if(e.code==='Space'||e.code==='ArrowUp') release(); });
  var stage=document.getElementById('stage'), jbn=document.getElementById('jb');
  [stage,jbn].forEach(function(el){ el.addEventListener('pointerdown',function(e){ e.preventDefault(); press(); });
    ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ el.addEventListener(ev,release); }); });
  document.getElementById('rb').addEventListener('click',function(){ ac(); restart(0); });
  var au=document.getElementById('au'); au.addEventListener('click',function(){ SND=!SND; au.textContent='Audio: '+(SND?'sì':'no'); if(SND){ ac(); if(MUS.want) musPlay(); } else musHalt(0.2); });
  state='wait'; requestAnimationFrame(step);
})();
