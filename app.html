<title>Invasione</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: plancia verticale a una colonna: avversario in alto, tre Fronti al centro, tu in basso con mano e azioni. */
:root{
 --bg:#0b1017;--panel:#131b26;--panel2:#1a2431;--line:#26354a;--fg:#e4ebf3;--mute:#8797ab;
 --terr:#4da6ff;--terr-bg:#17375a;--ali:#82d24f;--ali-bg:#223f16;--warn:#ff8a4c;--paper:#ead9a8;--ok:#5fd39a;
 --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
 color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 12px}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* start */
.start{display:flex;flex-direction:column;gap:18px;padding-top:18px}
.logo{font-family:var(--disp);font-weight:900;font-size:clamp(44px,15.5vw,92px);line-height:.9;letter-spacing:.01em;color:var(--paper);margin:0;text-wrap:balance}
.tag{color:var(--mute);margin:0;max-width:34ch}
.opt h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.seg button b{font-family:var(--disp);font-size:24px;letter-spacing:.03em;line-height:1}
.seg button small{color:var(--mute)}
.seg button.on{border-color:var(--paper);background:var(--panel2)}
.seg button.T b{color:var(--terr)}.seg button.A b{color:var(--ali)}
.go{border:0;background:var(--paper);color:#1a1608;font-family:var(--disp);font-weight:900;font-size:26px;letter-spacing:.06em;border-radius:8px;padding:12px}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:4px;align-self:flex-start}
/* home */
.home{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.brand{display:flex;flex-direction:column;gap:8px}
.quote{margin:0;font-size:15px;line-height:1.4;color:var(--fg);max-width:36ch;text-wrap:balance;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.quote span{display:block;margin-top:5px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.arena{position:relative;display:grid;grid-template-rows:1fr 1fr;gap:8px}
.side{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--line);min-height:138px;padding:16px;text-align:left;display:flex;flex-direction:column;transition:filter .25s ease,border-color .25s ease;isolation:isolate}
.side b{position:relative;z-index:2;font-family:var(--disp);font-weight:900;font-size:46px;letter-spacing:.04em;line-height:.9}
.side.A{justify-content:flex-end;background:
 radial-gradient(1.3px 1.3px at 10% 20%,#ffffff 50%,transparent 55%),radial-gradient(1px 1px at 30% 62%,#d9ffe0 50%,transparent 55%),
 radial-gradient(1.5px 1.5px at 46% 12%,#ffffff 50%,transparent 55%),radial-gradient(1px 1px at 20% 84%,#ffffff 50%,transparent 55%),
 radial-gradient(1px 1px at 56% 44%,#e4ffd8 50%,transparent 55%),radial-gradient(1.2px 1.2px at 5% 48%,#ffffff 50%,transparent 55%),
 radial-gradient(1px 1px at 38% 32%,#ffffff 50%,transparent 55%),
 radial-gradient(120% 95% at 82% 0%,rgba(130,210,79,.30),transparent 62%),
 linear-gradient(180deg,#040a05,#0a1b0d 60%,#11301a)}
.side.A b{color:var(--ali);text-shadow:0 0 18px rgba(130,210,79,.35)}
.side.T{justify-content:flex-start;background:
 radial-gradient(1.2px 1.2px at 70% 14%,#ffffff 50%,transparent 55%),radial-gradient(1px 1px at 88% 30%,#dbeaff 50%,transparent 55%),
 radial-gradient(1px 1px at 52% 22%,#ffffff 50%,transparent 55%),
 linear-gradient(180deg,#040b16,#08182e)}
.side.T b{color:var(--terr);text-shadow:0 0 18px rgba(77,166,255,.35)}
.earth{position:absolute;left:-18%;right:-18%;top:58%;height:260%;border-radius:50%;z-index:0;
 background:radial-gradient(ellipse 60% 22% at 50% 0%,#5aa6e8 0%,#1d5799 35%,#0b2b56 70%,#061a36 100%);
 box-shadow:0 -4px 26px 2px rgba(77,166,255,.5),inset 0 10px 22px rgba(170,215,255,.4)}
.ufo{position:absolute;right:6px;top:4px;width:132px;height:auto;z-index:1}
.side .fl{position:absolute;z-index:1;transform:rotate(var(--r,0deg))}
.side:not(.on){filter:saturate(.45) brightness(.62)}
.side.on{border-color:var(--paper)}
.side .you{position:absolute;z-index:3;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--paper);color:var(--paper);background:rgba(11,16,23,.6);padding:3px 8px;border-radius:99px}
.side.A .you{top:14px;left:16px}.side.T .you{bottom:14px;left:16px}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font-family:var(--disp);font-weight:900;font-size:17px;letter-spacing:.04em;color:var(--paper);pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 6px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.resume{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--paper);background:var(--panel2);border-radius:10px;padding:12px 14px}
.resume b{font-family:var(--disp);font-size:24px;letter-spacing:.04em;color:var(--paper)}
.resume span{font-size:12px;color:var(--mute)}
.nostats{margin:0;font-size:12px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){
 .side.on .fl{animation:bob 3.4s ease-in-out infinite}.side.on .fl:nth-of-type(2n){animation-delay:-1.4s}
 .side.on .ufo .beam{animation:beam 2.6s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-5px) rotate(var(--r,0deg))}}
@keyframes beam{50%{opacity:.45}}
/* top */
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px}
.top .t{font-family:var(--disp);font-weight:900;font-size:20px;letter-spacing:.05em;color:var(--paper)}
.top .m{color:var(--mute);font-size:12px}
.score{font-family:var(--mono);font-size:15px;font-weight:600}
.score .me{color:var(--fg)}.score .op{color:var(--mute)}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:50%;width:28px;height:28px;padding:0}
/* players */
.pl{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;color:var(--mute)}
.pl .fac{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.05em}
.pl .fac.T{color:var(--terr)}.pl .fac.A{color:var(--ali)}
.pl .st{font-family:var(--mono);color:var(--fg)}
.pl .warn{color:var(--warn)}
.res{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:36px}
.res .lab{font-size:11px;color:var(--mute);margin-right:2px}
/* dice */
.die{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:7px;font-family:var(--mono);font-weight:600;font-size:17px;border:2px solid;font-style:normal;position:relative}
.die.T{background:var(--terr-bg);border-color:var(--terr);color:#d6eaff}
.die.A{background:var(--ali-bg);border-color:var(--ali);color:#e6ffd5}
.die.nul{opacity:.4;border-style:dashed}
.die.fz::after{content:"";position:absolute;inset:-5px;border-radius:10px;border:1px solid #bfe6ff;opacity:.8}
.die.sm{width:28px;height:28px;font-size:14px;border-radius:6px}
button.die{padding:0}
button.die.can{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--paper)}
button.die.sel{transform:translateY(-4px);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--warn)}
button.die:not(.can){filter:saturate(.6)}
/* fronts */
.front{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.fh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fh b{font-family:var(--disp);font-size:18px;letter-spacing:.04em;font-weight:700}
.chip{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;background:var(--panel2);color:var(--fg)}
button.chip{cursor:pointer}
.chip.ev{border-color:#5b4d2a;color:var(--paper)}
.fr{display:flex;align-items:center;gap:5px;min-height:36px;flex-wrap:wrap}
.fr .sum{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--mute)}
.fr.mine{border-top:1px dashed var(--line);padding-top:6px}
.fr .empty{color:var(--mute);font-size:12px}
.drop{border:1px dashed var(--paper);background:transparent;color:var(--paper);border-radius:8px;padding:9px;font-weight:600}
.spaces{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px;font-size:12px;text-align:left;min-height:62px;display:flex;flex-direction:column;gap:4px;justify-content:space-between}
.slot.free{border-color:var(--paper);color:var(--fg)}
.slot.taken{opacity:.75}
.slot .who{font-size:11px;color:var(--mute)}
/* hand */
.hand{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.card{flex:0 0 124px;scroll-snap-align:start;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11px;line-height:1.25;min-height:56px}
.card>span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .v{font-family:var(--mono);font-size:11px;color:var(--paper);border-top:1px solid var(--line);padding-top:6px}
.card.T{border-top:3px solid var(--terr)}.card.A{border-top:3px solid var(--ali)}
.nohand{color:var(--mute);font-size:12px;padding:8px 0}
/* actions */
.status{font-size:12.5px;padding:6px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line)}
.status.me{border-color:var(--paper);color:var(--paper)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.acts button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:13px}
.acts button.pass{background:var(--panel2);font-weight:600}
.acts button.vir{color:var(--warn);border-color:#5a3a26}
.log{border-top:1px solid var(--line);padding-top:8px;color:var(--mute);font-size:12px}
.log summary{cursor:pointer}
.log ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;max-height:240px;overflow:auto}
.log li.h{color:var(--paper);margin-top:6px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(4,7,11,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:520px;max-height:82%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px) + var(--badge,0px));display:flex;flex-direction:column;gap:10px}
.sheet h2{font-family:var(--disp);font-size:24px;letter-spacing:.04em;margin:0;color:var(--paper);font-weight:700}
.sheet p{margin:0;color:var(--mute)}
.sheet .b{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:11px 12px;text-align:left}
.sheet .b:hover{border-color:var(--paper)}
.sheet .b.sec{background:transparent;color:var(--mute)}
.sheet .b.hi{border-color:var(--paper)}
.sheet p.vir{color:var(--warn);font-size:17px;font-weight:600;line-height:1.35}
.rr{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.rr small{color:var(--mute)}.rr em{font-style:normal;color:var(--paper)}
.big{font-family:var(--disp);font-size:44px;font-weight:900;line-height:1;margin:0}
.big.w{color:var(--ok)}.big.l{color:var(--warn)}
#tip{position:fixed;z-index:50;max-width:min(320px,86vw);background:var(--panel2);border:1px solid var(--paper);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;pointer-events:none;white-space:pre-line;color:var(--fg);box-shadow:0 6px 24px rgba(0,0,0,.5)}
[data-tip]{cursor:help}
.ov[data-a]{cursor:pointer}
.dock{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom,0px) + var(--badge,0px));display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax)}
#app{min-height:calc(100vh - 24px);min-height:calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.credit{margin-top:auto;text-align:center;font-size:11px;letter-spacing:.06em;color:var(--mute);padding:8px 0 4px}
.credit.end{padding-bottom:calc(8px + var(--badge,0px))}
.opp{display:flex;flex-direction:column;gap:4px}
.dock .res{min-height:36px}
.hint{font-size:11px;color:var(--mute);text-align:center}
.sheet.tall{max-height:92%}
.sheet.tall p{color:var(--fg)}
.sheet.tall p.step{color:var(--mute);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sheet details{border-top:1px solid var(--line);padding:8px 0}
.sheet summary{font-family:var(--disp);font-size:21px;letter-spacing:.04em;color:var(--paper);cursor:pointer}
.sheet ul{margin:6px 0 0;padding-left:18px;color:var(--fg);display:flex;flex-direction:column;gap:6px}
.sheet li b{color:var(--paper)}
.mock{pointer-events:none;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.mock .front{background:var(--panel)}
.mock .die.glow{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--paper)}
.mock .die.lift{transform:translateY(-4px);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--warn)}
.mock .acts span{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:13px}
.mock .acts span.pass{background:var(--panel2);font-weight:600}.mock .acts span.vir{color:var(--warn);border-color:#5a3a26}
.mock .hand{overflow:hidden}
.mock .b{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 12px}.mock .b.hi{border-color:var(--paper)}
.nb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--paper);color:#1a1608;font-size:11px;font-weight:700;font-family:var(--mono);flex:0 0 auto}
.sheet ul.legend{list-style:none;padding:0;gap:8px}.legend li{display:flex;gap:8px;align-items:flex-start}
.sheet.tall p.tx{font-size:15px;line-height:1.45}
.nav{display:flex;gap:8px}.nav .b{flex:1;text-align:center}
.links{display:flex;gap:18px;flex-wrap:wrap}
.top{flex-wrap:nowrap}
.top .score{font-size:14px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){button.die.can{animation:pl 1.6s ease-in-out infinite}}
@keyframes pl{50%{box-shadow:0 0 0 2px var(--bg),0 0 0 6px rgba(234,217,168,.35)}}
</style>
<div id="app"></div>
<div id="tip" hidden></div>
<script>
/*ENGINE*/
/*BOT*/
(function(){
'use strict';
const H=0,FR=INV.FR,EVN=INV.EVN,EVD=INV.EVD,CN=INV.CN,SPN=INV.SPN;
const CD={M:'Vince la somma più alta dei dadi validi.',DH:'Vince chi ha più dadi validi. Parità: somma più alta.',DL:'Vince chi ha più dadi validi. Parità: somma più bassa.',B:'Vince chi arriva a 12 o ci si avvicina di più senza superarlo. Non puoi schierare un dado che ti porti oltre 12.'};
const QUOTES=['Quasi.','Non essere avido.','Non è obbligatorio utilizzare tutte le proprie Navi. Però provaci, dai.','Cambiare idea è consentito.','L\'effetto viene comunque applicato. Poi si controlla chi è ancora utile alla causa.','Nessun ricorso alla Corte Suprema Galattica.','Alla fine conta solo una cosa: quel Fronte è vuoto. Che figuraccia.','Una specie di riavvio del sistema, ma doloroso quasi quanto il ricordo di Windows Me.','Non è una battaglia. È burocrazia spaziale.','Per una volta nessuno ha avuto idee.','La fine arriva sempre troppo presto. In questo caso letteralmente.','Niente soldi e niente Tecnologie? Ti è andata bene.','Tanti saluti.','I risultati dei dadi sono sempre pubblici. Non è facile tenerli nascosti sotto al tavolo.','Vince il giocatore che nasconde un alieno in cantina.'];
const pickQ=old=>{let q;do{q=QUOTES[Math.floor(Math.random()*QUOTES.length)];}while(q===old&&QUOTES.length>1);return q;};
const SK='invasione.stats.v1';
function loadStats(){const z={g:0,w:0,l:0,d:0,normal:{g:0,w:0},hard:{g:0,w:0},T:{g:0,w:0},A:{g:0,w:0}};try{const v=JSON.parse(localStorage.getItem(SK)||'null');if(v&&typeof v.g==='number')return Object.assign(z,v);}catch(e){}return z;}
function recordStats(){const st=loadStats(),w=S.winner===H,l=S.winner===1-H,k=diff==='hard'?'hard':'normal',f=S.fac[H];st.g++;if(w)st.w++;else if(l)st.l++;else st.d++;st[k].g++;if(w)st[k].w++;st[f].g++;if(w)st[f].w++;try{localStorage.setItem(SK,JSON.stringify(st));}catch(e){}}
const SV='invasione.save.v2';
function saveGame(){if(!S)return;try{if(S.over){localStorage.removeItem(SV);return;}localStorage.setItem(SV,JSON.stringify({v:1,t:Date.now(),diff,S,pops:UI.pops,acc:UI.acc,accOn:UI.accOn,accCont:UI.accCont}));}catch(e){}}
function loadSave(){try{const d=JSON.parse(localStorage.getItem(SV)||'null');if(d&&d.v===1&&d.S&&!d.S.over&&d.S.pend)return d;}catch(e){}return null;}
function resumeHTML(){const d=loadSave();if(!d)return '';const g=d.S;
 return `<button class="resume" data-a="resume"><b>Riprendi la partita</b><span>${g.fac[H]==='T'?'Terrestri':'Alieni'} · ${d.diff==='hard'?'Difficile':'Normale'} · Round ${Math.min(Math.max(g.rd,1),3)}/3 · Tu ${g.pv[H]} – ${g.pv[1-H]} Avv.</span></button>`;}
const mkUI=sc=>({q:pickQ(),screen:sc,sheet:null,sel:null,grp:null,tsel:null,vsel:null,pops:[],acc:[],accOn:false,accCont:false});
let S=null,hf='T',diff='normal',UI=mkUI('start'),TG=null,tm=null;
const VT=[null,['Scarta una tua nave per questo round.','L\'avversario scarta una sua nave per questo round.'],['L\'avversario rilancia una tua nave.','Rilanci una nave dell\'avversario.'],['Se il 5° turno è già passato, il round termina subito. Altrimenti il contatore dei turni va al 5.','Se il 5° turno è già passato, il round termina subito. Altrimenti il contatore dei turni va al 5.'],['Paghi 1 € oppure elimini 2 Tecnologie dal tuo mazzo.','L\'avversario paga 1 € oppure elimina 2 Tecnologie dal suo mazzo.'],['Fino a fine round ogni Virus che prendi vale doppio.','Fino a fine round ogni Virus dell\'avversario vale doppio.'],['Ritiri una tua nave valida da un Fronte e la rilanci.','L\'avversario ritira una sua nave da un Fronte e la rilancia.'],['L\'avversario guadagna 1 €.','Guadagni 1 €.']];
try{if(/netlify\.app$/i.test(location.hostname))document.documentElement.style.setProperty('--badge','60px');}catch(e){}
const app=document.getElementById('app');
const tip=document.getElementById('tip');

 h:`<p class="tx">Il round finisce quando passate entrambi o dopo 10 turni. Chi perde un Fronte pesca 1 Tecnologia. Un Fronte vuoto regala 1 PV.</p>`},
{t:'I comandi',v:`<div class="acts"><span class="pass">Passa</span><span class="vir">Virus → €</span><span class="vir">Virus → extra</span></div><div style="display:flex;gap:6px;align-items:center"><span class="chip">Home</span><span class="icon" style="display:inline-grid;place-items:center">?</span></div>`,
 h:tLeg(['<b>Passa</b>: per ora non fai niente. Puoi tornare a giocare nei turni dopo.','<b>Virus</b>: monete o un\'azione in più, in cambio di un Virus.','<b>?</b> apre il regolamento. La partita si salva da sola.'])}];
function rulesHTML(){
 const sec=(t,b)=>`<details><summary>${t}</summary>${b}</details>`;
 const evs=[1,2,3,4,5,7,8,9,10,11,12].map(id=>`<li><b>${esc(EVN[id])}</b> — ${esc(EVD[id])}${id===9?' Spazi azione:'+FR.map((n,f)=>`<br><i>${esc(n)}</i>: `+esc(SPN[f].join(' · '))).join(''):''}</li>`).join('');
 const TL=[[1,'modSelf2'],[2,'modOpp2'],[3,'modSelf1'],[4,'modOpp1'],[5,'reroll'],[8,'moveOpp'],[9,'trade'],[10,'resp'],[12,'gain2'],[14,'freeze'],[15,'swapCond'],[16,'peek'],[23,'regrow'],[24,'wipe'],[20,'jolly']];
 const fx=k=>`<li><b>${esc(INV.FT[k].split(':')[0])}</b> — ${esc(TDESC[k])}</li>`;
 const tl=TL.map(a=>`<li><b>${esc(INV.TECH[a[0]].t)}</b> — ${esc(TDESC[a[1]])}</li>`).join('')+`<li><b>Esclusive dei Terrestri</b><ul>${['steal','reinf','mobil'].map(fx).join('')}</ul></li><li><b>Esclusive degli Alieni</b><ul>${['swapShips','contagion','mutate'].map(fx).join('')}</ul></li>`;
 return btn('tut0','','Apri il tutorial','hi')
 +sec('Obiettivo',`<p>Terrestri e Alieni si affrontano per 3 round su 3 Fronti. Le tue navi sono 7 dadi. Vincere una battaglia vale 1 Punto Vittoria, salvo diversa indicazione di un Evento. Alla fine del terzo round vince chi ha più PV.</p><ul><li>Chi perde una battaglia pesca 1 Tecnologia.</li><li>In caso di pareggio non succede nulla.</li><li><b>Obbligo di presenza</b>: per ogni Fronte dove non hai nessuna nave a fine round, l'avversario guadagna 1 PV. Non vale sui Fronti senza battaglia (Combattimento e Spazi azione).</li></ul>`)
 +sec('Preparazione e limiti',`<p>Ogni giocatore parte con 7 dadi e 1 moneta, poi prepara la mano:</p><ul><li>sceglie una delle sue 2 Tecnologie univoche; l'altra viene eliminata;</li><li>pesca 3 Tecnologie: ne tiene 1, ne rimette 1 nel mazzo, che viene rimescolato, ed elimina la terza.</li></ul><p>Si parte quindi con 2 Tecnologie in mano. Il primo giocatore del round 1 è casuale. All'inizio dei round 2 e 3 decide chi muove per primo il giocatore con meno PV; in caso di parità, chi aveva mosso per primo.</p><ul><li>Massimo 5 monete.</li><li>Massimo 5 Tecnologie in mano.</li><li>Le risorse oltre il limite si perdono.</li></ul>`)
 +sec('Il round',`<ul><li><b>Prepara</b>: tutti i dadi vengono lanciati; si assegnano 3 Eventi e 3 Condizioni ai Fronti. Una partita usa 9 degli 11 Eventi.</li><li><b>Agisci</b>: al massimo 10 turni, con un contatore comune. Ogni giocatore ha di norma 1 azione per turno.</li><li><b>Risolvi</b>: si controlla ogni Fronte, si assegnano PV e Tecnologie.</li><li><b>Ripristina</b>: i dadi tornano ai proprietari, Eventi e Condizioni vengono rimossi, finiscono gli effetti "fino a fine round". All'inizio dei round 2 e 3 ogni giocatore scarta 1 Virus (se può), guadagna 1 moneta e pesca 1 Tecnologia.</li></ul><p>Il round finisce dopo il decimo turno, oppure quando entrambi i giocatori passano, oppure per un effetto che lo conclude.</p>`)
 +sec('Le azioni',`<ul><li><b>Schierare una nave</b>: un dado in riserva va su un Fronte, rispettando l'Evento.</li><li><b>Vendere</b>: scarti 1 Tecnologia e guadagni 1 €.</li><li><b>Comprare</b>: spendi 2 € e peschi 1 Tecnologia.</li><li><b>Vendere e comprare</b>: entrambe le cose in una sola azione.</li><li><b>Giocare una Tecnologia</b>: applichi l'effetto della carta.</li><li><b>Usare un valore</b>: scarti la carta, dai a un dado in riserva uno dei valori indicati in basso e prendi 1 Virus.</li><li><b>Virus → monete</b>: prendi N Virus e guadagni N €.</li><li><b>Virus → azione extra</b>: prendi 1 Virus e fai subito un'altra azione, senza far avanzare il contatore dei turni.</li><li><b>Passare</b>: non agisci, ma puoi tornare ad agire nei turni successivi.</li></ul>`)
 +sec('Navi valide e nulle',`<p>Una nave già schierata può smettere di rispettare l'Evento a causa di una Tecnologia, di un Virus o di un altro effetto. Il dado resta sul Fronte ma diventa <b>nullo</b>: non conta per la somma, per il numero di dadi né per il Bersaglio. Non è permanente: se il valore cambia e torna a rispettare l'Evento, la nave torna valida subito.</p>`)
 +sec('Le Condizioni',`<ul><li><b>Valore massimo</b>: vince la somma più alta dei dadi validi.</li><li><b>Dadi (spareggio alto)</b>: vince chi ha più dadi validi. A parità vince la somma più alta.</li><li><b>Dadi (spareggio basso)</b>: vince chi ha più dadi validi. A parità vince la somma più bassa.</li><li><b>Bersaglio</b>: vince chi arriva a 12 o si avvicina di più senza superarlo. Non puoi schierare un dado che ti porterebbe oltre 12. Se superi 12 per un effetto, perdi contro chi non ha sforato.</li></ul>`)
 +sec('Gli Eventi',`<ul>${evs}</ul>`)
 +sec('Le Tecnologie',`<p>Sono segrete e tenute in mano. Si possono vendere, comprare, giocare per l'effetto oppure scartare per usare uno dei valori in basso sulla carta. Ogni mazzo ha 24 carte: 21 uguali per le due fazioni e 3 esclusive.</p><ul>${tl}</ul>`)
 +sec('Tecnologie univoche',`<p>Ogni fazione ha 2 Tecnologie univoche, senza valori e meno potenti delle altre. A inizio partita se ne sceglie una e l'altra viene eliminata. Si usano come le altre Tecnologie.</p><ul><li><b>Terrestri</b><ul>${['vacc','rerollR'].map(fx).join('')}</ul></li><li><b>Alieni</b><ul>${['mimic','spore'].map(fx).join('')}</ul></li></ul>`)
 +sec('I Virus',`<p>Ogni Virus preso fa pescare una carta Virus, che si applica subito, e aggiunge un segnalino sulla tua plancia. Massimo 3 segnalini: al quarto i segnalini tornano a 0 e si risolvono 2 carte Virus. Il mazzo ha 2 copie di ogni effetto, tranne quello che chiude il round (1 copia).</p><ul>${VD.slice(1).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`)
 +sec('Fine partita e spareggi',`<p>Dopo il terzo round vince chi ha più PV. In caso di parità, in ordine:</p><ul><li>più monete + Tecnologie in mano;</li><li>meno segnalini Virus sulla plancia;</li><li>se è ancora parità, vince chi nasconde un alieno in cantina.</li></ul>`);}
function resultsHTML(){return S.res.map(r=>{if(r.flip)return `<div class="rr"><b>${FR[r.f]}</b><small>Lato B: nessuna battaglia</small></div>`;
 const w=r.w<0?'Pareggio':r.w===H?'Vinci tu':'Vince l\'avversario';
 const tb=r.tb?`<small>Stesso numero di dadi validi (${r.vc[H]}). Spareggio: somma ${r.cond==='DH'?'più alta':'più bassa'} (tu Σ${r.sum[H]}, avv. Σ${r.sum[1-H]}), quindi ${r.w===H?'vinci tu':'vince l\'avversario'}.</small>`:'';
 return `<div class="rr"><b>${FR[r.f]}</b><small>${esc(EVN[r.ev])} · ${CN[r.cond]}</small><span>Tu: ${r.vc[H]} navi valide, Σ${r.sum[H]} · Avv.: ${r.vc[1-H]} navi valide, Σ${r.sum[1-H]}</span>${tb}<em>${w} · PV +${r.g[H]} tu, +${r.g[1-H]} avv.</em></div>`;}).join('');}
function whyHTML(){const y=S.why;if(!y)return '';const pv=S.pv[H];let t='';
 if(y.k==='res')t=`Parità di Punti Vittoria (${pv} a ${pv}). Primo spareggio: monete + Tecnologie in mano. Tu ${y.v[H]}, avversario ${y.v[1-H]}: ${y.v[H]>y.v[1-H]?'vinci tu':'vince l\'avversario'}.`;
 else if(y.k==='vir')t=`Parità di Punti Vittoria (${pv} a ${pv}) e di monete + Tecnologie (${y.r[H]} a ${y.r[1-H]}). Secondo spareggio: meno segnalini Virus. Tu ${y.v[H]}, avversario ${y.v[1-H]}: ${y.v[H]<y.v[1-H]?'vinci tu':'vince l\'avversario'}.`;
 else t=`Parità su tutto: Punti Vittoria (${pv} a ${pv}), monete + Tecnologie (${y.v[0]}) e segnalini Virus. Come da regolamento decide chi nasconde un alieno in cantina.`;
 return `<div class="rr"><b>Spareggio</b><span>${esc(t)}</span></div>`;}
function popupHTML(){const p=UI.pops[0];let ttl,body;
 if(p.k==='virus'){const me=p.p===H;ttl='Virus';body=`<p>${me?'Hai pescato':'L\'avversario ha pescato'} questo Virus:</p><p class="vir">${esc(VT[p.c][me?0:1])}</p>`;}
 else if(p.k==='reboot'){ttl='Quarto Virus';body=`<p>${p.p===H?'Hai raggiunto':'L\'avversario ha raggiunto'} il quarto Virus: i segnalini tornano a 0 e si risolvono 2 carte Virus.</p>`;}
 else{ttl=p.title;body=p.lines.map(l=>`<p style="color:var(--fg)">${esc(l)}</p>`).join('');}
 return `<div class="ov" data-a="pop" data-v=""><div class="sheet" role="dialog"><h2>${esc(ttl)}</h2>${body}<p class="hint">Tocca ovunque per chiudere</p></div></div>`;}
function sheetHTML(){
 if(UI.pops.length)return popupHTML();
 let body='',ttl='',lead='',cancel=false,tall=false;
 const pd=S&&S.pend;
 if(UI.sheet&&UI.sheet.k==='newconf'){ttl='Iniziare una nuova partita?';body='<p>La partita salvata verrà cancellata.</p>'+btn('gonew','','Nuova partita','hi')+btn('close','','Annulla','sec');}
 else if(UI.sheet&&UI.sheet.k==='home'){ttl='Tornare alla home?';body='<p>La partita resta salvata: potrai riprenderla dalla schermata iniziale.</p>'+btn('new','','Torna alla home','hi')+btn('close','','Continua a giocare','sec');}
 else if(UI.sheet&&UI.sheet.k==='vconf'&&pd&&pd.p===H&&pd.ctx.then==='main'){const n=UI.sheet.n,u=n*(S.dbl[H]?2:1),v=S.vir[H];
  ttl=n>1?'Prendere '+n+' Virus?':'Prendere 1 Virus?';
  body=`<p style="color:var(--fg)">${esc(UI.sheet.lab)}</p><p>Pescherai ${u>1?u+' carte Virus':'una carta Virus'} e ne applicherai subito l'effetto${S.dbl[H]?' (ogni Virus vale doppio)':''}. Segnalini Virus attuali: ${v}/3.</p>`+(v+u>3?'<p class="vir">Attenzione: raggiungerai il quarto Virus. I segnalini tornano a 0 e pescherai 2 carte Virus.</p>':'')+btn('pickc',UI.sheet.i,'Conferma','hi')+btn('close','','Annulla','sec');}
 else if(UI.sheet&&UI.sheet.k==='help'){ttl='Regolamento';tall=true;body=btn('close','','Chiudi','sec')+rulesHTML();cancel=true;}
 else if(UI.sheet&&UI.sheet.k==='tut'){const n=UI.sheet.n,T=TUT[n];ttl=T.t;tall=true;
  body=`<p class="step">Tutorial · passo ${n+1} di ${TUT.length}</p><div class="mock" aria-hidden="true">${T.v}</div>${T.h}<div class="nav">${n>0?btn('tutn',n-1,'Indietro','sec'):''}${n<TUT.length-1?btn('tutn',n+1,'Avanti','hi'):btn('close','','Ho capito, si gioca','hi')}</div>`;cancel=true;} else if(UI.sheet&&UI.sheet.k==='ev'){const fr=S.fr[UI.sheet.f];ttl=FR[UI.sheet.f];cancel=true;
  body=`<p><b style="color:var(--paper)">${esc(EVN[fr.ev])}</b></p><p>${esc(EVD[fr.ev])}</p>${fr.cond?`<p><b style="color:var(--paper)">${CN[fr.cond]}</b></p><p>${CD[fr.cond]}</p>`:''}`;}
 else if(UI.sheet&&UI.sheet.k==='card'&&pd&&pd.p===H&&pd.ctx.then==='main'){const id=UI.sheet.id,inf=info();cancel=true;ttl='Tecnologia';
  body=`<p style="color:var(--fg)"><b>${esc(INV.tt(S,H,id))}</b></p><p>${esc(techTip(id)).replace(/\n/g,'<br>')}</p>`;let n=0;
  if(inf.plays[id]!==undefined){body+=btn('pick',inf.plays[id],'Gioca la carta','hi');n++;}
  if(inf.sells[id]!==undefined){body+=btn('pick',inf.sells[id],'Vendi per 1 €');n++;}
  if(inf.sb[id]!==undefined){body+=btn('pick',inf.sb[id],'Vendi (+1 €) e compra una Tecnologia (−2 €)');n++;}
  {const seenV={};(inf.vals[id]||[]).forEach(x=>{if(seenV[x.v])return;seenV[x.v]=1;body+=btn('vsel',id+':'+x.v,'Usa il valore '+x.v+' (+1 Virus)');n++;});}
  if(!n)body+='<p>Ora non puoi usare questa carta.</p>';}
 else if(UI.sheet&&UI.sheet.k==='vc'&&pd&&pd.p===H&&pd.ctx.then==='main'){const inf=info();cancel=true;ttl='Virus in cambio di monete';
  body='<p>Ogni Virus pesca una carta Virus con effetto immediato.</p>'+inf.vc.map(x=>btn('pick',x.i,`Prendi ${x.n} Virus → +${x.n} €`)).join('');}
 else if(pd&&pd.p===H&&pd.ctx.then!=='main'){
  const c=pd.ctx;
  if(c.then==='ack'){ttl='Round '+S.resRd+' concluso';body=resultsHTML()+`<p>Punti Vittoria: tu ${S.pv[H]}, avversario ${S.pv[1-H]}.</p>`+btn('pick',0,'Prosegui','hi');}
  else{ttl=c.ttl||'Scegli';
   const recent=S.log.filter(e=>e.to===null||e.to===H).slice(-2).map(e=>e.t);
   if(c.then==='resp'||c.then==='first')lead=recent.join(' · ');
   if(TG){if(!UI.tsel)return '';
    const th=c.then,lab=l=>{const k=l.indexOf(' → ');if(k<0)return l;const r=l.slice(k+3);return th==='techMove'||th==='spMove'?'Sposta su '+r:'Nuovo valore: '+r;};
    const o2=pd.opts;const first=o2.find(x=>x.v.o+':'+x.v.i===UI.tsel);
    lead=first?first.l.split(' → ')[0]:'';
    body=o2.map((x,i)=>x.v.o+':'+x.v.i===UI.tsel?btn('pick',i,lab(x.l)):'').join('')+btn('tback','','Scegli un\'altra nave','sec');
    return `<div class="ov"><div class="sheet" role="dialog"><h2>${esc(ttl)}</h2><p>${esc(lead)}</p>${body}</div></div>`;}
   const o=pd.opts;let items=o.map((x,i)=>({i,l:x.l}));
   const grp=o.length>8&&o.every(x=>x.v&&x.v.o!==undefined&&x.v.i!==undefined&&x.l.indexOf(' → ')>0);
   if(grp&&UI.grp===null){const seen={},gs=[];o.forEach(x=>{const k=x.l.split(' → ')[0];if(!seen[k]){seen[k]=1;gs.push(k);}});
    body=gs.map(k=>btn('grp',k,k)).join('');items=null;}
   else if(grp){body=btn('back','','← Altre navi','sec')+o.map((x,i)=>x.l.split(' → ')[0]===UI.grp?btn('pick',i,x.l.split(' → ').slice(1).join(' → ')):'').join('');items=null;}
   if(items)body=items.map(x=>btn('pick',x.i,x.l)).join('');}}
 else if(S&&S.over){const w=S.winner;ttl='Partita conclusa';
  body=`<p class="big ${w===H?'w':w===-1?'':'l'}">${w===H?'HAI VINTO':w===-1?'PAREGGIO':'HAI PERSO'}</p><p>Punti Vittoria: tu ${S.pv[H]}, avversario ${S.pv[1-H]}.</p>${whyHTML()}${S.res?resultsHTML():''}`+btn('new','','Nuova partita','hi');}
 else return '';
 return `<div class="ov"><div class="sheet ${tall?'tall':''}" role="dialog"><h2>${esc(ttl)}</h2>${lead?`<p>${esc(lead)}</p>`:''}${body}${cancel?btn('close','','Chiudi','sec'):''}</div></div>`;}
function pub(from){const me=fname(S.fac[H]);return S.log.slice(from).filter(e=>e.to===null||e.to===H).map(e=>e.t).filter(t=>t.charAt(0)!=='—'&&t.charAt(0)!=='☣'&&t.indexOf(' PV)')<0&&t.indexOf('Entrambi passano')<0&&t.indexOf('Partita conclusa')<0).map(t=>t.replace(/\b(Terrestri|Alieni)\b/g,m=>m===me?'Tu':'Avversario'));}
function drain(){if(S.q&&S.q.length){S.q.forEach(x=>UI.pops.push(x));S.q=[];}}
function advance(){if(S&&S.over&&!S.rec){S.rec=true;recordStats();}
 UI.sel=null;UI.grp=null;UI.tsel=null;UI.vsel=null;
 drain();
 const pd=S.pend,humanNow=S.over||!pd||pd.p===H;
 if(humanNow&&UI.acc.length){UI.pops.unshift({k:'tech',title:UI.accCont?'Esito':'Mossa dell\'avversario',lines:UI.acc});UI.acc=[];
  const cont=!S.over&&pd&&pd.ctx.then!=='main'&&pd.ctx.then!=='ack';UI.accCont=cont;UI.accOn=cont;}
 else if(humanNow&&!UI.acc.length&&UI.accOn&&!(pd&&pd.ctx.then!=='main')){UI.accOn=false;UI.accCont=false;}
 render();kick();saveGame();}
function kick(){if(!S||S.over||!S.pend||S.pend.p===H||UI.pops.length)return;clearTimeout(tm);tm=setTimeout(botMove,diff==='hard'?80:420);}
function botMove(){if(!S||!S.pend||S.pend.p===H||UI.pops.length)return;
 const pd=S.pend,idx=diff==='hard'?BOT.hardChoose(S,{K:8,R:18}):BOT.choose(S,.1),t=pd.opts[idx].v,from=S.log.length;
 const mod=pd.ctx.then==='main'&&t&&(t.t==='play'||t.t==='val'||(t.t==='place'&&(S.fr[t.f].ev===7||S.fr[t.f].ev===11||S.fr[t.f].flip)));
 if(mod||(pd.ctx.then==='resp'&&t===true)){UI.accOn=true;UI.accCont=false;}
 INV.answer(S,idx);
 if(UI.accOn)UI.acc.push(...pub(from));
 advance();}
function virusN(o){const a=o&&o.v;if(!a)return 0;if(a.t==='vcoins')return a.n;if(a.t==='vextra'||a.t==='val')return 1;if(a.t==='play'){const k=INV.tk(S,H,a.c);if(k==='trade'||k==='wipe')return 1;}return 0;}
function act(i,force){if(!S.pend||S.pend.p!==H)return;
 if(!force&&S.pend.ctx.then==='main'){const n=virusN(S.pend.opts[+i]);if(n>0){UI.sheet={k:'vconf',i:+i,n,lab:S.pend.opts[+i].l};render();return;}}
 UI.sheet=null;const from=S.log.length;
 try{INV.answer(S,+i);}catch(e){console.error(e);}
 if(UI.accOn)UI.acc.push(...pub(from));
 advance();}
const HD={
 hf:v=>{hf=v;render();},df:v=>{diff=v;render();},
 go:()=>{if(loadSave()){UI.sheet={k:'newconf'};render();return;}HD.gonew();},
 gonew:()=>{clearTimeout(tm);S=INV.newGame({fac:[hf,hf==='T'?'A':'T'],hold:H});UI=mkUI('game');advance();},
 resume:()=>{const d=loadSave();if(!d){render();return;}clearTimeout(tm);S=d.S;diff=d.diff==='hard'?'hard':'normal';hf=S.fac[H];UI=mkUI('game');UI.pops=d.pops||[];UI.acc=d.acc||[];UI.accOn=!!d.accOn;UI.accCont=!!d.accCont;advance();},
 new:()=>{clearTimeout(tm);UI=mkUI('start');S=null;render();},
 help:()=>{UI.sheet={k:'help'};render();},
 close:()=>{UI.sheet=null;render();},
 ev:v=>{UI.sheet={k:'ev',f:+v};render();},
 die:v=>{UI.sel=UI.sel===v?null:v;render();},
 card:v=>{UI.sheet={k:'card',id:+v};render();},
 vc:()=>{UI.sheet={k:'vc'};render();},
 vsel:v=>{const p=v.split(':');UI.vsel={c:+p[0],v:+p[1]};UI.sheet=null;UI.sel=null;render();},
 vcancel:()=>{UI.vsel=null;render();},
 vdie:k=>{if(!UI.vsel||!S.pend||S.pend.p!==H)return;const i=info().vd[UI.vsel.c+'/'+UI.vsel.v+'/'+k];UI.vsel=null;if(i===undefined){render();return;}act(i);},
 tut0:()=>{UI.sheet={k:'tut',n:0};render();},tutn:v=>{UI.sheet={k:'tut',n:+v};render();},
 pick:v=>act(v),q:()=>{UI.q=pickQ(UI.q);render();},pickc:v=>act(v,true),homeq:()=>{UI.sheet={k:'home'};render();},tdie:v=>{UI.tsel=v;render();},tback:()=>{UI.tsel=null;render();},pop:()=>{UI.pops.shift();render();kick();saveGame();},
 grp:v=>{UI.grp=v;render();},back:()=>{UI.grp=null;render();}};
app.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=HD[t.dataset.a];if(f)f(t.dataset.v);});
app.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t);else hideTip();});
app.addEventListener('mouseleave',hideTip);
window.addEventListener('scroll',hideTip,true);
window.addEventListener('pagehide',saveGame);
document.addEventListener&&document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveGame();});
render();
})();
</script>
